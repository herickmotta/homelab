---
sentinel_base_hostname: sentinel
sentinel_base_timezone: Etc/UTC
sentinel_base_supported_ubuntu_releases:
  - "24.04"
  - "26.04"

sentinel_base_deployment_user: gha
sentinel_base_deployment_group: gha
sentinel_base_deployment_authorized_keys: []
sentinel_base_hermes_user: hermes
sentinel_base_hermes_group: hermes

sentinel_base_enable_firewall: true
sentinel_base_management_cidrs: []
sentinel_base_ssh_port: 22
sentinel_base_open_tcp_ports: []

sentinel_base_packages:
  - ca-certificates
  - curl
  - docker-compose-v2
  - docker.io
  - git
  - jq
  - openssh-server
  - python-is-python3
  - python3
  - python3-pip
  - python3-venv
  - rsync
  - tar
  - ufw
  - unattended-upgrades
  - unzip
