---
- name: Validate the target operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["os_family"] == "Debian"
    fail_msg: This role supports Debian-family Linux hosts only.

- name: Inspect the CPU frequency policy
  ansible.builtin.stat:
    path: /sys/devices/system/cpu/cpufreq/policy0
    follow: true
  register: proxmox_host_power_cpufreq

- name: Require CPU frequency control
  ansible.builtin.assert:
    that:
      - proxmox_host_power_cpufreq.stat.isdir | default(false)
    fail_msg: CPU frequency control is not exposed through sysfs.

- name: Read the active CPU scaling driver
  ansible.builtin.slurp:
    src: /sys/devices/system/cpu/cpufreq/policy0/scaling_driver
  register: proxmox_host_power_active_driver

- name: Require the configured CPU scaling driver
  ansible.builtin.assert:
    that:
      - >-
        (proxmox_host_power_active_driver.content | b64decode | trim)
        == proxmox_host_power_required_scaling_driver
    fail_msg: The host CPU scaling driver does not match the declared policy.

- name: Install passive CPU and power telemetry tools
  ansible.builtin.apt:
    name: "{{ proxmox_host_power_telemetry_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Inspect installed services
  ansible.builtin.service_facts:

- name: Disable the legacy CPU power policy service
  when:
    - not ansible_check_mode
    - >-
      'homelab-cpu-power-policy.service' in ansible_facts.services
  ansible.builtin.systemd_service:
    name: homelab-cpu-power-policy.service
    enabled: false
    state: stopped

- name: Remove legacy CPU power policy files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/local/sbin/homelab-cpu-power-policy
    - /etc/systemd/system/homelab-cpu-power-policy.service
  register: proxmox_host_power_legacy_files

- name: Reload systemd after removing the legacy service
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    daemon_reload: true
  changed_when: proxmox_host_power_legacy_files.changed

- name: Keep the distribution cpupower service from competing for policy
  when:
    - not ansible_check_mode
    - "'cpupower.service' in ansible_facts.services"
  ansible.builtin.systemd_service:
    name: cpupower.service
    enabled: false
    state: stopped

- name: Install the declarative CPU power policy
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/homelab-cpu-power.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible. Applied by systemd-tmpfiles during boot.
      w /sys/devices/system/cpu/cpufreq/policy*/scaling_governor - - - - {{ proxmox_host_power_cpu_governor }}
      w /sys/devices/system/cpu/cpufreq/policy*/energy_performance_preference - - - - {{
        proxmox_host_power_energy_performance_preference
      }}
  register: proxmox_host_power_policy_file

- name: Apply the CPU power policy
  when: not ansible_check_mode
  ansible.builtin.command:
    argv:
      - systemd-tmpfiles
      - --create
      - /etc/tmpfiles.d/homelab-cpu-power.conf
  changed_when: proxmox_host_power_policy_file.changed
