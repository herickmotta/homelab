---
- name: Restart Samba
  ansible.builtin.systemd_service:
    name: smbd.service
    state: restarted

- name: Restart node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter.service
    state: restarted
    daemon_reload: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
