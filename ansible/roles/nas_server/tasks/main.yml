---
- name: Validate the target operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["os_family"] == "Debian"
    fail_msg: This role supports Debian-family Linux hosts only.

- name: Require Samba credentials and mounts
  ansible.builtin.assert:
    that:
      - nas_server_smb_username | length > 0
      - nas_server_smb_password | length > 0
      - nas_server_mounts | length > 0
    fail_msg: NAS serving requires a username, password, and at least one VirtioFS mount.
  no_log: true

- name: Reject placeholder Samba passwords
  ansible.builtin.assert:
    that:
      - nas_server_smb_password is not match('(?i)^replace')
    fail_msg: Set a real SMB_PASSWORD in private SOPS before applying the NAS role.
  no_log: true

- name: Validate NAS mounts
  ansible.builtin.assert:
    that:
      - item.mapping | length > 0
      - item.path is match('^/')
      - item.share | length > 0
      - item.share is match('^[A-Za-z][A-Za-z0-9_]*$')
      - "'volatile' not in item.mapping"
      - "'volatile' not in item.path"
      - "'volatile' not in item.share"
    fail_msg: >-
      NAS mount {{ item.share | default('unknown') }} must declare a mapping,
      absolute path, and share name, and must not expose volatile datasets.
  loop: "{{ nas_server_mounts }}"
  loop_control:
    label: "{{ item.share | default(item.mapping) }}"

- name: Require unique share names and guest paths
  ansible.builtin.assert:
    that:
      - >-
        (nas_server_mounts | map(attribute='share') | list | unique | length)
        == (nas_server_mounts | length)
      - >-
        (nas_server_mounts | map(attribute='path') | list | unique | length)
        == (nas_server_mounts | length)
      - >-
        (nas_server_mounts | map(attribute='mapping') | list | unique | length)
        == (nas_server_mounts | length)
    fail_msg: NAS share names, guest paths, and mapping IDs must be unique.

- name: Install NAS packages
  ansible.builtin.apt:
    name: "{{ nas_server_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create homelab, share, and Prometheus directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ ['/etc/homelab', nas_server_prometheus_textfile_dir] + (nas_server_mounts | map(attribute='path') | list) }}"

- name: Install persistent VirtioFS mounts
  ansible.builtin.blockinfile:
    path: /etc/fstab
    marker: "# {mark} homelab nas virtiofs"
    block: |
      {% for mount in nas_server_mounts %}
      {{ mount.mapping }} {{ mount.path }} virtiofs {{ 'ro' if mount.read_only | default(false) else 'rw' }},_netdev,x-systemd.device-timeout=60 0 0
      {% endfor %}

- name: Inspect required VirtioFS mounts
  ansible.builtin.command:
    argv:
      - findmnt
      - -n
      - -T
      - "{{ item.path }}"
  register: nas_server_findmnt
  changed_when: false
  failed_when: false
  loop: "{{ nas_server_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Mount required VirtioFS filesystems
  ansible.builtin.command:
    argv:
      - mount
      - "{{ item.item.path }}"
  register: nas_server_mount
  changed_when: nas_server_mount.rc == 0
  when: item.rc != 0
  loop: "{{ nas_server_findmnt.results }}"
  loop_control:
    label: "{{ item.item.path }}"

- name: Install expected NAS configuration
  ansible.builtin.copy:
    dest: /etc/homelab/nas-expected.json
    owner: root
    group: root
    mode: "0644"
    content: "{{ nas_server_expected | to_nice_json }}"
  vars:
    nas_server_expected:
      schema_version: 1
      mounts: "{{ nas_server_mounts }}"
      smb_conf: "{{ nas_server_smb_conf }}"
      node_exporter_service: prometheus-node-exporter
      prometheus_textfile: "{{ nas_server_prometheus_textfile_dir }}/homelab-nas.prom"

- name: Install NAS health command
  ansible.builtin.copy:
    src: homelab-nas-health
    dest: /usr/local/sbin/homelab-nas-health
    owner: root
    group: root
    mode: "0755"

- name: Create the UNIX Samba account
  ansible.builtin.user:
    name: "{{ nas_server_smb_username }}"
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
    system: true
    groups: []

- name: Discover Samba accounts
  ansible.builtin.command:
    argv:
      - pdbedit
      - -L
  register: nas_server_pdbedit
  changed_when: false

- name: Create or update the Samba password
  ansible.builtin.command:
    argv:
      - smbpasswd
      - -a
      - -s
      - "{{ nas_server_smb_username }}"
    stdin: "{{ nas_server_smb_password }}\n{{ nas_server_smb_password }}\n"
  no_log: true
  changed_when: >-
    nas_server_smb_username not in nas_server_pdbedit.stdout

- name: Install Samba configuration
  ansible.builtin.template:
    src: smb.conf.j2
    dest: "{{ nas_server_smb_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Samba

- name: Inspect installed services
  ansible.builtin.service_facts:

- name: Disable NetBIOS
  when: "'nmbd.service' in ansible_facts.services"
  ansible.builtin.systemd_service:
    name: nmbd.service
    enabled: false
    state: stopped

- name: Enable Samba
  ansible.builtin.systemd_service:
    name: smbd.service
    enabled: true
    state: started

- name: Install node exporter defaults
  ansible.builtin.template:
    src: node-exporter-default.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  notify: Restart node exporter

- name: Enable node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter.service
    enabled: true
    state: started

- name: Install NAS health systemd units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: homelab-nas-health.service.j2
      dest: /etc/systemd/system/homelab-nas-health.service
    - src: homelab-nas-health.timer.j2
      dest: /etc/systemd/system/homelab-nas-health.timer
  notify: Reload systemd

- name: Enable NAS health timer
  ansible.builtin.systemd_service:
    name: homelab-nas-health.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Apply pending NAS service changes
  ansible.builtin.meta: flush_handlers

- name: Collect NAS health
  ansible.builtin.command:
    argv:
      - /usr/local/sbin/homelab-nas-health
      - --json
      - --prometheus
  register: nas_server_health
  changed_when: false
  failed_when: nas_server_health.rc >= 2
