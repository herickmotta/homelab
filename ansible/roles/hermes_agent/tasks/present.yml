---
- name: Install iptables for container egress policy
  ansible.builtin.apt:
    name: iptables
    state: present

- name: Create the Hermes Agent group
  ansible.builtin.group:
    name: "{{ hermes_agent_runtime_group }}"
    gid: "{{ hermes_agent_runtime_gid | int }}"
    system: true

- name: Create the Hermes Agent runtime user
  ansible.builtin.user:
    name: "{{ hermes_agent_runtime_user }}"
    uid: "{{ hermes_agent_runtime_uid | int }}"
    group: "{{ hermes_agent_runtime_group }}"
    home: "{{ hermes_agent_data_dir }}"
    create_home: false
    shell: /usr/sbin/nologin
    system: true
    password_lock: true

- name: Create Hermes Agent directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ hermes_agent_install_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ hermes_agent_managed_dir }}"
      owner: root
      group: "{{ hermes_agent_runtime_group }}"
      mode: "0750"
    - path: "{{ hermes_agent_data_dir }}"
      owner: "{{ hermes_agent_runtime_user }}"
      group: "{{ hermes_agent_runtime_group }}"
      mode: "0750"
    - path: "{{ hermes_agent_backup_dir }}"
      owner: "{{ hermes_agent_runtime_user }}"
      group: "{{ hermes_agent_runtime_group }}"
      mode: "0750"
    - path: "{{ hermes_agent_data_dir }}/home"
      owner: "{{ hermes_agent_runtime_user }}"
      group: "{{ hermes_agent_runtime_group }}"
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"

- name: Install the Hermes Agent image pin
  ansible.builtin.template:
    src: pin.txt.j2
    dest: "{{ hermes_agent_install_dir }}/PIN.txt"
    owner: root
    group: root
    mode: "0644"

- name: Install Hermes Agent managed configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ hermes_agent_managed_dir }}/config.yaml"
    owner: root
    group: "{{ hermes_agent_runtime_group }}"
    mode: "0644"
  notify: Recreate Hermes Agent compose

- name: Install Hermes Agent managed secrets
  ansible.builtin.template:
    src: managed.env.j2
    dest: "{{ hermes_agent_managed_dir }}/.env"
    owner: root
    group: "{{ hermes_agent_runtime_group }}"
    mode: "0640"
  no_log: true
  notify: Recreate Hermes Agent compose

- name: Install Grafana MCP secrets
  when: hermes_agent_grafana_enabled | bool
  ansible.builtin.template:
    src: grafana-mcp.env.j2
    dest: "{{ hermes_agent_managed_dir }}/grafana-mcp.env"
    owner: root
    group: "{{ hermes_agent_runtime_group }}"
    mode: "0640"
  no_log: true
  notify: Recreate Hermes Agent compose

- name: Remove Grafana MCP secrets when disabled
  when: not (hermes_agent_grafana_enabled | bool)
  ansible.builtin.file:
    path: "{{ hermes_agent_managed_dir }}/grafana-mcp.env"
    state: absent

- name: Install Hermes Agent identity
  ansible.builtin.template:
    src: SOUL.md.j2
    dest: "{{ hermes_agent_data_dir }}/SOUL.md"
    owner: "{{ hermes_agent_runtime_user }}"
    group: "{{ hermes_agent_runtime_group }}"
    mode: "0644"

- name: Configure optional GitHub App draft-PR access
  when: hermes_agent_github_enabled | bool
  ansible.builtin.include_tasks: github.yml

- name: Remove GitHub App files when draft-PR access is disabled
  when: not (hermes_agent_github_enabled | bool)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ hermes_agent_managed_dir }}/github-app.pem"
    - "{{ hermes_agent_managed_dir }}/bin/github-app-token"
    - "{{ hermes_agent_managed_dir }}/bin/gh"
    - "{{ hermes_agent_managed_dir }}/bin/gh-bin"
    - "{{ hermes_agent_managed_dir }}/bin/git-credential-github-app"
    - "{{ hermes_agent_data_dir }}/home/.gitconfig"

- name: Configure optional read-only Proxmox API access
  when: hermes_agent_pve_enabled | bool
  ansible.builtin.include_tasks: pve.yml

- name: Remove the Proxmox helper when read-only API access is disabled
  when: not (hermes_agent_pve_enabled | bool)
  ansible.builtin.file:
    path: "{{ hermes_agent_managed_dir }}/bin/pve-get"
    state: absent

- name: Install Hermes Agent Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ hermes_agent_install_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate Hermes Agent compose

- name: Install the Hermes Agent egress script
  ansible.builtin.template:
    src: egress.sh.j2
    dest: "{{ hermes_agent_egress_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: Reload Hermes Agent egress

- name: Install the Hermes Agent egress unit
  ansible.builtin.template:
    src: egress.service.j2
    dest: "/etc/systemd/system/{{ hermes_agent_egress_unit }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload Hermes Agent egress

- name: Stat the Hermes OAuth store
  ansible.builtin.stat:
    path: "{{ hermes_agent_data_dir }}/auth.json"
  register: hermes_agent_auth_stat

- name: Restrict Hermes OAuth store permissions
  when: hermes_agent_auth_stat.stat.exists
  ansible.builtin.file:
    path: "{{ hermes_agent_data_dir }}/auth.json"
    owner: "{{ hermes_agent_runtime_user }}"
    group: "{{ hermes_agent_runtime_group }}"
    mode: "0600"

- name: Enable Hermes Agent egress policy
  ansible.builtin.systemd_service:
    name: "{{ hermes_agent_egress_unit }}"
    enabled: true
    state: started
    daemon_reload: true

- name: Apply Hermes Agent Compose handlers
  ansible.builtin.meta: flush_handlers

- name: Check whether the Hermes Agent Compose project is running
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - ps
      - -q
    chdir: "{{ hermes_agent_install_dir }}"
  register: hermes_agent_compose_ps
  changed_when: false

- name: Start the Hermes Agent Compose project
  when: hermes_agent_compose_ps.stdout | trim | length == 0
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - -d
    chdir: "{{ hermes_agent_install_dir }}"
  changed_when: true
