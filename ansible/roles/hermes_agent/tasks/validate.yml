---
- name: Validate the target operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["os_family"] == "Debian"
    fail_msg: This role supports Debian-family Linux hosts only.

- name: Validate the Hermes Agent image and source pins
  ansible.builtin.assert:
    that:
      - hermes_agent_source_repository is match('^https://github.com/NousResearch/hermes-agent$')
      - hermes_agent_source_commit is match('^[0-9a-f]{40}$')
      - hermes_agent_image_repository == 'nousresearch/hermes-agent'
      - hermes_agent_image_digest is match('^sha256:[0-9a-f]{64}$')
      - "'latest' not in hermes_agent_image_repository"
      - "':' not in hermes_agent_image_repository"
      - "'@' not in hermes_agent_image_repository"
    fail_msg: >-
      Hermes Agent must pin the official repository, a 40-character source
      commit, and an immutable sha256 image digest. Moving tags are rejected.

- name: Validate Hermes Agent runtime identity and paths
  ansible.builtin.assert:
    that:
      - hermes_agent_install_dir is match('^/')
      - hermes_agent_data_dir is match('^/')
      - hermes_agent_managed_dir is match('^/')
      - hermes_agent_backup_dir is match('^/')
      - hermes_agent_container_data_dir == '/opt/data'
      - hermes_agent_runtime_user | length > 0
      - hermes_agent_runtime_user != 'root'
      - hermes_agent_runtime_uid | int > 0
      - hermes_agent_runtime_gid | int > 0
      - hermes_agent_network_subnet is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}/[0-9]+$')
      - hermes_agent_dns_servers | length > 0
      - hermes_agent_profile | length > 0
      - hermes_agent_provider | length > 0
      - hermes_agent_model | length > 0
      - hermes_agent_openai_runtime == 'auto'
      - hermes_agent_provider in hermes_agent_oauth_providers
        or hermes_agent_provider in hermes_agent_provider_env_names
    fail_msg: >-
      Hermes Agent needs non-root host identity, absolute state paths, a
      private Docker subnet, public DNS, and a known provider. openai_runtime
      must stay auto so Hermes keeps its own tool loop.

- name: Validate Hermes Agent public DNS resolvers
  ansible.builtin.assert:
    that:
      - item is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - item is not match('^(10\\.|127\\.|169\\.254\\.|172\\.(1[6-9]|2[0-9]|3[0-1])\\.|192\\.168\\.)')
    fail_msg: Hermes Agent DNS resolvers must be public unicast addresses.
  loop: "{{ hermes_agent_dns_servers }}"

- name: Require Telegram binding when Hermes Agent is enabled
  when: hermes_agent_enabled | bool
  ansible.builtin.assert:
    that:
      - hermes_agent_telegram_enabled | bool
      - hermes_agent_telegram_user_id | string is match('^[0-9]+$')
      - hermes_agent_telegram_admin_id | string is match('^[0-9]+$')
      - (hermes_agent_telegram_user_id | string) == (hermes_agent_telegram_admin_id | string)
      - (hermes_agent_telegram_user_id | string) | length >= 5
    fail_msg: >-
      Enabled Hermes Agent needs exactly one numeric Telegram user ID, and
      that same ID as administrator.

- name: Require Telegram secrets when Hermes Agent is enabled
  when: hermes_agent_enabled | bool
  ansible.builtin.assert:
    that:
      - hermes_agent_telegram_bot_token | length > 0
      - hermes_agent_telegram_bot_token is not match('(?i)^replace')
    fail_msg: Enabled Hermes Agent needs a Telegram bot token that is not a placeholder.
  no_log: true

- name: Require a provider API key for non-OAuth Hermes providers
  when:
    - hermes_agent_enabled | bool
    - hermes_agent_provider not in hermes_agent_oauth_providers
  ansible.builtin.assert:
    that:
      - hermes_agent_provider_api_key | length > 0
      - hermes_agent_provider_api_key is not match('(?i)^replace')
    fail_msg: This Hermes provider needs an API key that is not a placeholder.
  no_log: true

- name: Reject leftover provider API keys for OAuth Hermes providers
  when:
    - hermes_agent_enabled | bool
    - hermes_agent_provider in hermes_agent_oauth_providers
  ansible.builtin.assert:
    that:
      - hermes_agent_provider_api_key | length == 0
    fail_msg: >-
      OAuth Hermes providers authenticate via device login into auth.json on
      the data volume. Do not inject a provider API key.

- name: Require GitHub App binding when draft-PR access is enabled
  when:
    - hermes_agent_enabled | bool
    - hermes_agent_github_enabled | bool
  ansible.builtin.assert:
    that:
      - hermes_agent_github_app_id | string is match('^[0-9]+$')
      - hermes_agent_github_installation_id | string is match('^[0-9]+$')
      - hermes_agent_github_app_slug | length > 0
      - "' ' not in hermes_agent_github_app_slug"
      - hermes_agent_github_app_private_key | length > 0
      - "'BEGIN ' in hermes_agent_github_app_private_key"
      - "'PRIVATE KEY' in hermes_agent_github_app_private_key"
      - hermes_agent_github_repos | length > 0
      - hermes_agent_github_repos_dir is match('^/')
      - hermes_agent_github_container_repos_dir == '/opt/data/repos'
    fail_msg: >-
      Enabled GitHub App access needs numeric app and installation IDs, the
      app slug, a PEM, and at least one https repository.
  no_log: true

- name: Validate GitHub App repositories
  when:
    - hermes_agent_enabled | bool
    - hermes_agent_github_enabled | bool
  ansible.builtin.assert:
    that:
      - item.name | length > 0
      - item.name is match('^[A-Za-z0-9._-]+$')
      - item.url is match("^https://github.com/.+\\.git$")
    fail_msg: GitHub App repositories must use https GitHub clone URLs and safe directory names.
  loop: "{{ hermes_agent_github_repos }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"

- name: Reject GitHub App secrets when draft-PR access is disabled
  when: not (hermes_agent_github_enabled | bool)
  ansible.builtin.assert:
    that:
      - hermes_agent_github_app_private_key | length == 0
    fail_msg: Do not pass a GitHub App private key when GitHub access is disabled.
  no_log: true

- name: Require Proxmox binding when read-only API access is enabled
  when:
    - hermes_agent_enabled | bool
    - hermes_agent_pve_enabled | bool
  ansible.builtin.assert:
    that:
      - hermes_agent_pve_ipv4 is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - hermes_agent_pve_user is match('^[A-Za-z0-9._-]+@pve$')
      - hermes_agent_pve_token_name is match('^[A-Za-z0-9._-]+$')
      - hermes_agent_pve_port | int == 8006
      - hermes_agent_pve_token_value | length > 0
      - hermes_agent_pve_token_value is not match('(?i)^replace')
    fail_msg: >-
      Enabled Proxmox access needs a hypervisor IPv4, hermes@pve-style user,
      token name, and a non-placeholder token secret. Egress is TCP 8006 only.
  no_log: true

- name: Reject Proxmox secrets when read-only API access is disabled
  when: not (hermes_agent_pve_enabled | bool)
  ansible.builtin.assert:
    that:
      - hermes_agent_pve_token_value | length == 0
    fail_msg: Do not pass a Proxmox token when read-only API access is disabled.
  no_log: true

- name: Require Grafana binding when read-only MCP access is enabled
  when:
    - hermes_agent_enabled | bool
    - hermes_agent_grafana_enabled | bool
  ansible.builtin.assert:
    that:
      - hermes_agent_grafana_ipv4 is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$')
      - hermes_agent_grafana_port | int == 3000
      - hermes_agent_grafana_url is match('^https?://[^ ]+$')
      - hermes_agent_grafana_viewer_token | length > 0
      - hermes_agent_grafana_viewer_token is not match('(?i)^replace')
      - hermes_agent_grafana_mcp_server_token | length > 0
      - hermes_agent_grafana_mcp_server_token is not match('(?i)^replace')
      - hermes_agent_grafana_image_repository == 'grafana/mcp-grafana'
      - hermes_agent_grafana_image_digest is match('^sha256:[0-9a-f]{64}$')
      - hermes_agent_grafana_enabled_tools is search('runpanelquery')
    fail_msg: >-
      Enabled Grafana MCP needs a Grafana IPv4, port 3000, URL, Viewer token,
      immutable official image, and panel-query tool. Egress is TCP 3000 only.
  no_log: true

- name: Reject Grafana secrets when read-only MCP access is disabled
  when: not (hermes_agent_grafana_enabled | bool)
  ansible.builtin.assert:
    that:
      - hermes_agent_grafana_viewer_token | length == 0
      - hermes_agent_grafana_mcp_server_token | length == 0
    fail_msg: Do not pass a Grafana Viewer token when Grafana MCP is disabled.
  no_log: true
