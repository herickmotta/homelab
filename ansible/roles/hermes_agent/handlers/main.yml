---
# Pull when compose image tags change; up -d recreates only services whose
# definition changed. Bind-mounted configs may need a targeted restart (Phase 3).
- name: Recreate Hermes Agent compose
  ansible.builtin.shell: |
    docker compose pull --quiet
    docker compose up -d
  args:
    chdir: "{{ hermes_agent_install_dir }}"
  changed_when: true

- name: Reload Hermes Agent egress
  ansible.builtin.systemd_service:
    name: "{{ hermes_agent_egress_unit }}"
    state: restarted
    enabled: true
    daemon_reload: true

- name: Reload Grafana Hermes relay
  ansible.builtin.systemd_service:
    name: "{{ hermes_agent_relay_unit }}"
    state: restarted
    enabled: true
    daemon_reload: true

- name: Reload Grafana Hermes relay ingress
  ansible.builtin.systemd_service:
    name: "{{ hermes_agent_relay_ingress_unit }}"
    state: restarted
    enabled: true
    daemon_reload: true
