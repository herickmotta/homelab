---
# Disabled and conservative until a site opts in.
hermes_agent_enabled: false
hermes_agent_full_capability: false
hermes_agent_preserve_state_on_disable: true

# Upstream pin: v2026.8.27 / Hermes Agent v0.20.6.
# Image index digest carries OCI label
# org.opencontainers.image.revision matching this commit.
hermes_agent_source_repository: https://github.com/NousResearch/hermes-agent
hermes_agent_source_commit: "5fc308a70719a83cccdbba4c0e39c23f5a8239d5"
hermes_agent_image_repository: nousresearch/hermes-agent
hermes_agent_image_digest: "sha256:e0df6adebddf29b91112aefc999d4aaf6846c9eb544faca5672a16a13590ff79"

hermes_agent_install_dir: /opt/hermes-agent
hermes_agent_data_dir: /opt/hermes-agent/data
hermes_agent_managed_dir: /opt/hermes-agent/managed
hermes_agent_backup_dir: /opt/hermes-agent/data/backups
hermes_agent_container_data_dir: /opt/data
hermes_agent_container_managed_dir: /opt/hermes-policy

hermes_agent_runtime_user: hermes
hermes_agent_runtime_group: hermes
hermes_agent_runtime_uid: 10000
hermes_agent_runtime_gid: 10000

hermes_agent_container_name: hermes-agent
hermes_agent_profile: default
hermes_agent_timezone: Etc/UTC

hermes_agent_network_name: hermes-agent
hermes_agent_network_subnet: 172.30.136.0/24
hermes_agent_dns_servers:
  - 1.1.1.1
  - 1.0.0.1

hermes_agent_cpus: "2.0"
hermes_agent_memory: 3g
hermes_agent_pids_limit: 256
hermes_agent_log_max_size: "10m"
hermes_agent_log_max_file: "5"

hermes_agent_healthcheck_interval: 30s
hermes_agent_healthcheck_timeout: 10s
hermes_agent_healthcheck_retries: 5
hermes_agent_healthcheck_start_period: 90s

# openai-codex uses ChatGPT device-code OAuth in auth.json on the data volume.
# Do not default openai_runtime to codex_app_server: that drops Hermes
# delegate_task, memory, session_search, and todo from the live tool loop.
hermes_agent_provider: openai-codex
hermes_agent_model: gpt-5.6-luna
hermes_agent_openai_runtime: auto
hermes_agent_model_aliases:
  luna:
    provider: openai-codex
    model: gpt-5.6-luna
  sol:
    provider: openai-codex
    model: gpt-5.6-sol
hermes_agent_provider_api_key: ""
hermes_agent_oauth_providers:
  - openai-codex
hermes_agent_provider_env_names:
  openrouter: OPENROUTER_API_KEY
  openai: OPENAI_API_KEY
  anthropic: ANTHROPIC_API_KEY
  google: GOOGLE_API_KEY
  gemini: GEMINI_API_KEY
  nous: NOUS_API_KEY

hermes_agent_telegram_enabled: false
hermes_agent_telegram_user_id: ""
hermes_agent_telegram_admin_id: ""
hermes_agent_telegram_bot_token: ""

hermes_agent_egress_unit: hermes-agent-egress.service
hermes_agent_egress_script: /usr/local/sbin/hermes-agent-egress

# Optional GitHub App draft-PR worker. Disabled until a site supplies the
# App, installation, PEM, and repository list. Merge remains operator-only.
hermes_agent_github_enabled: false
hermes_agent_github_app_id: ""
hermes_agent_github_installation_id: ""
hermes_agent_github_app_slug: ""
hermes_agent_github_app_private_key: ""
hermes_agent_github_git_name: ""
hermes_agent_github_git_email: ""
hermes_agent_github_repos: []
hermes_agent_github_repos_dir: /opt/hermes-agent/data/repos
hermes_agent_github_container_repos_dir: /opt/data/repos
hermes_agent_github_cli_version: "2.98.0"
hermes_agent_github_cli_archive_sha256: "3b8ac6b30336802fc1a858d7c084e11cdf24ac1a761ca90b68022d7d729208de"

# Optional read-only Proxmox API. Disabled until a site supplies a distinct
# PVEAuditor token and the hypervisor IPv4. Egress stays denied except TCP
# 8006 to that one address.
hermes_agent_pve_enabled: false
hermes_agent_pve_ipv4: ""
hermes_agent_pve_user: ""
hermes_agent_pve_token_name: ""
hermes_agent_pve_token_value: ""
hermes_agent_pve_verify_ssl: false
hermes_agent_pve_port: 8006
# Optional read-only Grafana MCP. Disabled until a site supplies a Viewer token
# and Grafana address. The MCP sidecar exposes no write tools.
hermes_agent_grafana_enabled: false
hermes_agent_grafana_ipv4: ""
hermes_agent_grafana_port: 3000
hermes_agent_grafana_url: ""
hermes_agent_grafana_viewer_token: ""
hermes_agent_grafana_mcp_server_token: ""
# Host path only. Do not place this file in the Hermes policy mount.
hermes_agent_grafana_mcp_env_file: /opt/hermes-agent/grafana-mcp.env
hermes_agent_grafana_image_repository: grafana/mcp-grafana
hermes_agent_grafana_image_digest: "sha256:f21a19cebbfa7c3a76ef1746171e5ffc3601064e432f593e7c6cb526e5216e5f"
hermes_agent_grafana_mcp_address: ":8000"
hermes_agent_grafana_mcp_host: grafana-mcp:8000
hermes_agent_grafana_enabled_tools: search,dashboard,folder,navigation,rendering,runpanelquery,alerting,prometheus,loki

# Grafana Alerting webhook → host relay → loopback Hermes HMAC-v2.
# Disabled until a site supplies secrets and the observe source IPv4.
hermes_agent_webhook_enabled: false
hermes_agent_webhook_port: 8644
hermes_agent_webhook_route: grafana-alert
hermes_agent_webhook_secret: ""
hermes_agent_relay_listen_host: "0.0.0.0"
hermes_agent_relay_listen_port: 8787
hermes_agent_relay_allow_from: ""
hermes_agent_relay_grafana_hmac_secret: ""
hermes_agent_relay_max_body_bytes: 65536
hermes_agent_relay_rate_per_minute: 30
hermes_agent_relay_unit: grafana-hermes-relay.service
hermes_agent_relay_ingress_unit: grafana-hermes-relay-ingress.service
hermes_agent_relay_script: /usr/local/lib/homelab/grafana_hermes_relay.py
hermes_agent_relay_env_file: /opt/hermes-agent/relay.env
hermes_agent_relay_ingress_script: /usr/local/sbin/grafana-hermes-relay-ingress
hermes_agent_relay_state_dir: /var/lib/grafana-hermes-relay
