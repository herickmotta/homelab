---
- name: Recreate Sentinel monitoring
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate --remove-orphans
    chdir: "{{ sentinel_monitoring_install_dir }}"
  changed_when: true

- name: Restart Sentinel heartbeat
  ansible.builtin.systemd_service:
    name: sentinel-heartbeat.timer
    enabled: true
    state: restarted
    daemon_reload: true
