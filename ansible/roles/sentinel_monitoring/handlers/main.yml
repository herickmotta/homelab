---
# Pull when compose image tags change; up -d recreates only services whose
# definition changed.
- name: Recreate Sentinel monitoring
  ansible.builtin.shell: |
    docker compose pull --quiet
    docker compose up -d --remove-orphans
  args:
    chdir: "{{ sentinel_monitoring_install_dir }}"
  changed_when: true

- name: Restart Sentinel heartbeat
  ansible.builtin.systemd_service:
    name: sentinel-heartbeat.timer
    enabled: true
    state: restarted
    daemon_reload: true
