---
- name: Require Hermes runtime inputs
  ansible.builtin.assert:
    that:
      - hermes_user | length > 0
      - hermes_group | length > 0
      - hermes_listen_address is match('^127\\.0\\.0\\.1:[0-9]+$')
      - hermes_install_dir is match('^/')
      - hermes_state_dir is match('^/')
      - hermes_config_dir is match('^/')
      - hermes_webhook_secret | length >= 16
      - hermes_telegram_bot_token | length > 0
      - hermes_telegram_chat_id | length > 0
      - hermes_openai_api_key | length > 0
      - hermes_sentinel_prometheus_url is match('^http://127\\.0\\.0\\.1:')
      - hermes_pve_url | length > 0
      - hermes_pve_token_id | length > 0
      - hermes_pve_token_secret | length > 0
      - hermes_pve_node | length > 0
      - hermes_github_token | length > 0
      - hermes_github_repository is match('^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$')
      - hermes_allowed_hosts | length > 0
      - hermes_allowed_services | length > 0
      - hermes_allowed_vmids | length > 0
      - hermes_allowed_git_paths | length > 0
      - hermes_log_sources | length > 0
    fail_msg: Enabling Hermes needs loopback listen, scoped secrets, and allowlists.
  no_log: true

- name: Reject secret Git paths
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9._/-]+$')
      - "'..' not in item"
      - not item.startswith('/')
      - not item.startswith('secrets')
      - "'.sops.' not in item"
    fail_msg: Hermes Git paths must be allowlisted site files, never secrets.
  loop: "{{ hermes_allowed_git_paths }}"

- name: Validate log sources
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9._-]+$')
      - item.host is match('^[A-Za-z0-9._-]+$')
      - item.kind in ['unit', 'container']
      - item.selector | length > 0
    fail_msg: Each Hermes log source needs a name, host, kind, and selector.
  loop: "{{ hermes_log_sources }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Require the isolated Hermes user
  ansible.builtin.user:
    name: "{{ hermes_user }}"
    group: "{{ hermes_group }}"
    shell: /usr/sbin/nologin
    password_lock: true
    system: true
    create_home: true
    home: "/var/lib/{{ hermes_user }}"

- name: Create Hermes directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ hermes_install_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ hermes_install_dir }}/app"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ hermes_config_dir }}"
      owner: root
      group: "{{ hermes_group }}"
      mode: "0750"
    - path: "{{ hermes_state_dir }}"
      owner: "{{ hermes_user }}"
      group: "{{ hermes_group }}"
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"

- name: Install Hermes application sources
  ansible.builtin.copy:
    src: src/
    dest: "{{ hermes_install_dir }}/app/src/"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Hermes

- name: Install Hermes package metadata
  ansible.builtin.copy:
    src: pyproject.toml
    dest: "{{ hermes_install_dir }}/app/pyproject.toml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Hermes

- name: Create the Hermes virtualenv
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ hermes_install_dir }}/venv"
    creates: "{{ hermes_install_dir }}/venv/bin/python"

- name: Install Hermes into the virtualenv
  ansible.builtin.pip:
    name: "{{ hermes_install_dir }}/app"
    virtualenv: "{{ hermes_install_dir }}/venv"
    extra_args: --upgrade
  notify: Restart Hermes

- name: Install the Hermes environment file
  ansible.builtin.template:
    src: hermes.env.j2
    dest: "{{ hermes_config_dir }}/hermes.env"
    owner: root
    group: "{{ hermes_group }}"
    mode: "0640"
  no_log: true
  notify: Restart Hermes

- name: Install the Hermes unit
  ansible.builtin.template:
    src: hermes.service.j2
    dest: /etc/systemd/system/hermes.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart Hermes

- name: Load the generated Hermes unit
  ansible.builtin.slurp:
    src: /etc/systemd/system/hermes.service
  register: hermes_unit_slurp

- name: Assert Hermes unit hardening
  ansible.builtin.assert:
    that:
      - "'User={{ hermes_user }}' in hermes_unit"
      - "'127.0.0.1' in hermes_unit"
      - "'ProtectSystem=strict' in hermes_unit"
      - "'NoNewPrivileges=true' in hermes_unit"
      - "'docker' not in hermes_unit | lower"
      - "'/var/run/docker.sock' not in hermes_unit"
    fail_msg: Hermes must run as the isolated user on loopback with a hardened unit.
  vars:
    hermes_unit: "{{ hermes_unit_slurp.content | b64decode }}"

- name: Enable Hermes
  ansible.builtin.systemd_service:
    name: hermes.service
    enabled: true
    state: started
    daemon_reload: true

- name: Apply Hermes handlers
  ansible.builtin.meta: flush_handlers

- name: Wait for the Hermes health endpoint
  ansible.builtin.uri:
    url: "http://{{ hermes_listen_address }}/healthz"
    status_code: 200
    return_content: false
  register: hermes_ready
  retries: 12
  delay: 3
  until: hermes_ready.status | default(0) == 200
