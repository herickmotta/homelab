---
- name: Validate Hermes operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["os_family"] == "Debian"
    fail_msg: Hermes supports Debian-family Linux hosts only.

- name: Include the enabled Hermes runtime
  when: hermes_enabled | bool
  ansible.builtin.include_tasks: present.yml

- name: Remove the Hermes runtime
  when: not (hermes_enabled | bool)
  ansible.builtin.include_tasks: absent.yml
