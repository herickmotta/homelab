---
- name: Check for an installed Hermes unit
  ansible.builtin.stat:
    path: /etc/systemd/system/hermes.service
  register: hermes_unit_stat

- name: Stop Hermes
  when: hermes_unit_stat.stat.exists | bool
  ansible.builtin.systemd_service:
    name: hermes.service
    state: stopped
    enabled: false
    daemon_reload: true

- name: Remove the Hermes unit
  ansible.builtin.file:
    path: /etc/systemd/system/hermes.service
    state: absent
  notify: Reload systemd

- name: Remove Hermes runtime files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ hermes_config_dir }}/hermes.env"
    - "{{ hermes_install_dir }}"
    - "{{ hermes_state_dir }}"
  loop_control:
    label: "{{ item }}"

- name: Apply Hermes removal handlers
  ansible.builtin.meta: flush_handlers
