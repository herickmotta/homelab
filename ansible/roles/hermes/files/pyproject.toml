[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-triage"
version = "0.1.0"
description = "Read-only Sentinel triage webhook and Telegram bot"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
]

[project.scripts]
hermes-triage = "hermes_triage.service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
