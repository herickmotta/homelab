---
argument_specs:
  main:
    short_description: Run the isolated read-only Hermes triage service
    options:
      hermes_enabled:
        type: bool
        default: false
      hermes_user:
        type: str
        default: hermes
      hermes_group:
        type: str
        default: hermes
      hermes_install_dir:
        type: path
        default: /opt/hermes
      hermes_state_dir:
        type: path
        default: /var/lib/hermes/state
      hermes_config_dir:
        type: path
        default: /etc/hermes
      hermes_listen_address:
        type: str
        default: 127.0.0.1:8787
      hermes_webhook_secret:
        type: str
      hermes_telegram_bot_token:
        type: str
      hermes_telegram_chat_id:
        type: str
      hermes_openai_api_key:
        type: str
      hermes_model_default:
        type: str
        default: gpt-5.6-luna
      hermes_model_complex:
        type: str
        default: gpt-5.6-sol
      hermes_sentinel_prometheus_url:
        type: str
        default: http://127.0.0.1:9090
      hermes_observe_prometheus_url:
        type: str
      hermes_observe_loki_url:
        type: str
      hermes_pve_url:
        type: str
      hermes_pve_token_id:
        type: str
      hermes_pve_token_secret:
        type: str
      hermes_pve_node:
        type: str
      hermes_github_token:
        type: str
      hermes_github_repository:
        type: str
      hermes_allowed_hosts:
        type: list
        elements: str
      hermes_allowed_services:
        type: list
        elements: str
      hermes_allowed_vmids:
        type: list
        elements: int
      hermes_allowed_git_paths:
        type: list
        elements: str
      hermes_log_sources:
        type: list
        elements: dict
        options:
          name:
            type: str
            required: true
          host:
            type: str
            required: true
          kind:
            type: str
            required: true
            choices:
              - unit
              - container
          selector:
            type: str
            required: true
