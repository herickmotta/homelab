---
# Pull when compose image tags change; up -d recreates only services whose
# definition changed. Bind-mounted configs may need a targeted restart (Phase 3).
- name: Recreate data platform compose
  ansible.builtin.shell: |
    docker compose pull --quiet
    docker compose up -d --remove-orphans
  args:
    chdir: "{{ data_platform_install_dir }}"
  changed_when: true

- name: Reload data platform API ingress
  ansible.builtin.systemd_service:
    name: "{{ data_platform_ingress_unit }}"
    state: restarted
    enabled: true
    daemon_reload: true

- name: Reload data platform backup timer
  ansible.builtin.systemd_service:
    name: data-platform-backup.timer
    state: restarted
    enabled: true
    daemon_reload: true
