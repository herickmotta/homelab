---
argument_specs:
  main:
    short_description: Run Prometheus, Grafana, and Loki on the rich observability guest
    options:
      observability_install_dir:
        type: path
        default: /opt/observability
      observability_site_label:
        type: str
        default: homelab
      observability_scrape_interval:
        type: str
        default: 30s
      observability_evaluation_interval:
        type: str
        default: 30s
      observability_retention_time:
        type: str
        default: 15d
      observability_retention_size:
        type: str
        default: 40GB
      observability_prometheus_image:
        type: str
      observability_grafana_image:
        type: str
      observability_node_exporter_image:
        type: str
      observability_pve_exporter_image:
        type: str
      observability_loki_image:
        type: str
      observability_loki_user:
        type: str
      observability_loki_group:
        type: str
      observability_loki_retention_period:
        type: str
        default: 336h
      observability_loki_http_listen_address:
        type: str
        default: 0.0.0.0
      observability_loki_http_listen_port:
        type: int
        default: 3100
      observability_loki_grpc_listen_address:
        type: str
        default: 127.0.0.1
      observability_loki_grpc_listen_port:
        type: int
        default: 9096
      observability_loki_ready_address:
        type: str
        default: 127.0.0.1:3100
      observability_prometheus_listen_address:
        type: str
      observability_grafana_alertmanager_host:
        type: str
        description: >-
          Unused for Prometheus notify. Grafana 13.2 cannot ingest Prometheus
          AM v2 POST arrays. Kept as a documented Grafana AM API host.
      observability_grafana_alertmanager_path_prefix:
        type: str
        default: /api/alertmanager/grafana
      observability_alertmanager_image:
        type: str
      observability_local_alertmanager_address:
        type: str
        description: Loopback host:port for Observe Alertmanager (Prometheus notify).
      observability_external_alertmanager_address:
        type: str
        description: >-
          Sentinel Alertmanager host:port for a Grafana read-only
          datasource. Grafana must not send Grafana-managed alerts there.
          Do not put Alertmanager on Caddy.
      observability_alert_for:
        type: str
        default: 2m
      observability_blackbox_image:
        type: str
      observability_blackbox_listen_address:
        type: str
      observability_http_targets:
        type: list
        elements: dict
      observability_tcp_targets:
        type: list
        elements: dict
      observability_icmp_targets:
        type: list
        elements: dict
      observability_smtp_host:
        type: str
      observability_smtp_port:
        type: int
      observability_smtp_username:
        type: str
      observability_smtp_password:
        type: str
      observability_smtp_from:
        type: str
      observability_smtp_require_tls:
        type: bool
      observability_email_destination:
        type: str
      observability_telegram_chat_id:
        type: str
      observability_telegram_bot_token:
        type: str
      observability_webhook_url:
        type: str
      observability_webhook_hmac_secret:
        type: str
      observability_error_log_alert_enabled:
        type: bool
        default: false
      observability_error_log_alert_threshold:
        type: int
        default: 10
      observability_error_log_alert_window:
        type: str
        default: 5m
      observability_error_log_alert_for:
        type: str
        default: 2m
      observability_alloy_targets:
        type: list
        elements: dict
        options:
          name:
            type: str
            required: true
          address:
            type: str
            required: true
          host:
            type: str
          dependency:
            type: str
            default: none
      observability_expected_log_hosts:
        type: list
        elements: str
      observability_node_exporter_listen_address:
        type: str
      observability_pve_exporter_listen_address:
        type: str
      observability_grafana_bind_ip:
        type: str
        default: 0.0.0.0
      observability_grafana_http_port:
        type: int
        default: 3000
      observability_grafana_scrape_address:
        type: str
      observability_grafana_admin_user:
        type: str
        default: admin
      observability_grafana_admin_password:
        type: str
        required: true
      observability_grafana_root_url:
        type: str
        required: true
      observability_node_targets:
        type: list
        elements: dict
        options:
          name:
            type: str
            required: true
          address:
            type: str
            required: true
          host:
            type: str
      observability_smartctl_address:
        type: str
      observability_zfs_address:
        type: str
      observability_accepted_degraded_serials:
        type: list
        elements: str
      observability_metrics_targets:
        type: list
        elements: dict
        options:
          name:
            type: str
            required: true
          address:
            type: str
            required: true
          scheme:
            type: str
            choices:
              - http
              - https
            default: http
          metrics_path:
            type: str
            default: /metrics
          keep_metrics:
            type: list
            elements: str
          dependency:
            type: str
            default: none
      observability_pve_enabled:
        type: bool
        default: false
      observability_pve_target:
        type: str
      observability_pve_user:
        type: str
      observability_pve_token_name:
        type: str
      observability_pve_token_value:
        type: str
      observability_pve_verify_ssl:
        type: bool
        default: false
