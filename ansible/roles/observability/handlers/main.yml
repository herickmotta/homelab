---
- name: Recreate observability compose
  ansible.builtin.command:
    cmd: docker compose up -d --force-recreate --remove-orphans
    chdir: "{{ observability_install_dir }}"
  changed_when: true

- name: Restart observe Docker inventory
  ansible.builtin.systemd_service:
    name: docker-inventory.timer
    state: restarted
    daemon_reload: true
    enabled: true
