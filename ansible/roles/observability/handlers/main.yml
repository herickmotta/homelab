---
# Pull when compose image tags change; up -d recreates only services whose
# definition changed. Bind-mounted configs may need a targeted restart (Phase 3).
- name: Recreate observability compose
  ansible.builtin.shell: |
    docker compose pull --quiet
    docker compose up -d --remove-orphans
  args:
    chdir: "{{ observability_install_dir }}"
  changed_when: true

- name: Restart observe Docker inventory
  ansible.builtin.systemd_service:
    name: docker-inventory.timer
    state: restarted
    daemon_reload: true
    enabled: true
