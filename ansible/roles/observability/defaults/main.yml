---
observability_install_dir: /opt/observability
observability_site_label: homelab
observability_scrape_interval: 30s
observability_evaluation_interval: 30s
observability_retention_time: 15d
observability_retention_size: 40GB

observability_prometheus_image: prom/prometheus:v3.14.0
observability_grafana_image: grafana/grafana:13.2.0
observability_node_exporter_image: prom/node-exporter:v1.12.1
observability_pve_exporter_image: prompve/prometheus-pve-exporter:3.10.0

observability_prometheus_listen_address: 127.0.0.1:9090
observability_node_exporter_listen_address: 127.0.0.1:9100
observability_pve_exporter_listen_address: 127.0.0.1:9221
observability_grafana_bind_ip: 0.0.0.0
observability_grafana_http_port: 3000
observability_grafana_scrape_address: 127.0.0.1:3000

observability_grafana_admin_user: admin
observability_grafana_admin_password: ""
observability_grafana_root_url: ""

observability_metrics_targets: []

observability_pve_enabled: false
observability_pve_target: ""
observability_pve_user: ""
observability_pve_token_name: ""
observability_pve_token_value: ""
observability_pve_verify_ssl: false
