---
- name: Validate the target operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["os_family"] == "Debian"
    fail_msg: This role supports Debian-family Linux hosts only.

- name: Require observability inputs
  ansible.builtin.assert:
    that:
      - observability_install_dir is match('^/')
      - observability_site_label | length > 0
      - observability_retention_time | length > 0
      - observability_retention_size | length > 0
      - observability_prometheus_image | length > 0
      - observability_grafana_image | length > 0
      - observability_loki_image | length > 0
      - observability_loki_retention_period | length > 0
      - observability_loki_http_listen_address | length > 0
      - observability_loki_http_listen_port | int > 0
      - observability_loki_ready_address | length > 0
      - observability_grafana_root_url is match('^https://')
      - observability_grafana_admin_user | length > 0
      - observability_grafana_admin_password | length >= 16
      - observability_grafana_admin_password is not match('(?i)^replace')
      - observability_grafana_http_port | int > 0
      - observability_grafana_bind_ip | length > 0
    fail_msg: >-
      Observability needs a pinned stack, HTTPS Grafana root URL, Loki
      retention, and a real admin password of at least 16 characters.
  no_log: true

- name: Derive Grafana Alerting notifier flags
  ansible.builtin.set_fact:
    observability_mail_enabled: "{{
        observability_email_destination | length > 0
        and observability_smtp_host | length > 0
        and observability_smtp_username | length > 0
        and observability_smtp_password | length > 0
        and observability_smtp_from | length > 0
      }}"
    observability_telegram_enabled: "{{
        observability_telegram_chat_id | length > 0
        and observability_telegram_bot_token | length > 0
      }}"
    observability_webhook_enabled: "{{
        observability_webhook_url | length > 0
        and observability_webhook_hmac_secret | length > 0
      }}"
    observability_blackbox_enabled: "{{
        (observability_http_targets | default([]) | length > 0)
        or (observability_tcp_targets | default([]) | length > 0)
        or (observability_icmp_targets | default([]) | length > 0)
      }}"
    observability_alerting_enabled: "{{
        (observability_email_destination | length > 0
        and observability_smtp_host | length > 0
        and observability_smtp_username | length > 0
        and observability_smtp_password | length > 0
        and observability_smtp_from | length > 0)
        or (observability_telegram_chat_id | length > 0
        and observability_telegram_bot_token | length > 0)
        or (observability_webhook_url | length > 0
        and observability_webhook_hmac_secret | length > 0)
      }}"
    observability_grafana_domain: "{{ observability_grafana_root_url | urlsplit('hostname') }}"

- name: Validate observability metrics targets
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9._-]+$')
      - item.address | length > 0
      - item.metrics_path | default('/metrics') is match('^/')
    fail_msg: Metrics targets need a safe name, address, and metrics path.
  loop: "{{ observability_metrics_targets }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Validate observability node targets
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9._-]+$')
      - item.address | length > 0
    fail_msg: Node targets need a safe name and scrape address.
  loop: "{{ observability_node_targets }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Validate observability Alloy targets
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9._-]+$')
      - item.address | length > 0
      - item.dependency | default('none') | length > 0
    fail_msg: Alloy targets need a safe name, scrape address, and dependency.
  loop: "{{ observability_alloy_targets }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Require unique expected log hosts
  when: observability_expected_log_hosts | length > 0
  ansible.builtin.assert:
    that:
      - >-
          observability_expected_log_hosts | unique | list | length
          == observability_expected_log_hosts | length
    fail_msg: expected_log_hosts must not contain duplicates.

- name: Validate expected log hosts match Alloy scrape host labels
  when: observability_expected_log_hosts | length > 0
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9._-]+$')
      - (matching_named_hosts | length) + (matching_unnamed_hosts | length) == 1
    fail_msg: >-
      Every expected log host must match exactly one Alloy scrape host label
      (target.host, or target.name when host is omitted).
  loop: "{{ observability_expected_log_hosts }}"
  vars:
    matching_named_hosts: "{{ observability_alloy_targets | selectattr('host', 'defined') | selectattr('host', 'equalto', item) | list }}"
    matching_unnamed_hosts: "{{ observability_alloy_targets | rejectattr('host', 'defined') | selectattr('name', 'equalto', item) | list }}"

- name: Validate Grafana Alertmanager host
  when: observability_grafana_alertmanager_host | length > 0
  ansible.builtin.assert:
    that:
      - observability_grafana_alertmanager_host is match('^[0-9.a-zA-Z_-]+:[0-9]+$')
      - observability_grafana_alertmanager_path_prefix is match('^/')
    fail_msg: Grafana Alertmanager host must be host:port with a path prefix.

- name: Validate the Sentinel Alertmanager datasource address
  when: observability_external_alertmanager_address | length > 0
  ansible.builtin.assert:
    that:
      - observability_external_alertmanager_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}:[0-9]+$')
    fail_msg: Sentinel Alertmanager datasource must be IPv4 host:port.

- name: Reject partial Grafana email configuration
  ansible.builtin.assert:
    that:
      - >-
          (
            observability_email_destination | length > 0
            and observability_smtp_host | length > 0
            and observability_smtp_username | length > 0
            and observability_smtp_password | length > 0
            and observability_smtp_from | length > 0
          )
          or (
            observability_email_destination | length == 0
            and observability_smtp_host | length == 0
            and observability_smtp_username | length == 0
            and observability_smtp_password | length == 0
            and observability_smtp_from | length == 0
          )
    fail_msg: Grafana email paging needs destination, SMTP host, username, password, and from together.

- name: Reject partial Grafana Telegram configuration
  ansible.builtin.assert:
    that:
      - >-
          (observability_telegram_chat_id | length > 0)
          == (observability_telegram_bot_token | length > 0)
    fail_msg: Grafana Telegram paging needs both chat_id and bot token, or neither.

- name: Validate Grafana Telegram chat id
  when: observability_telegram_chat_id | length > 0
  ansible.builtin.assert:
    that:
      - observability_telegram_chat_id is match('^-100[0-9]+$')
      - observability_telegram_bot_token is not match('(?i)^replace')
    fail_msg: Grafana Telegram chat_id must be a channel id starting with -100.

- name: Reject partial Grafana webhook configuration
  ansible.builtin.assert:
    that:
      - >-
          (observability_webhook_url | length > 0)
          == (observability_webhook_hmac_secret | length > 0)
    fail_msg: Grafana-to-Hermes webhook needs both URL and HMAC secret, or neither.

- name: Validate Grafana webhook URL and secret
  when: observability_webhook_url | length > 0
  ansible.builtin.assert:
    that:
      - observability_webhook_url is match('^http://[0-9]{1,3}(\\.[0-9]{1,3}){3}:[0-9]+/')
      - observability_webhook_hmac_secret | length >= 16
      - observability_webhook_hmac_secret is not match('(?i)^replace')
    fail_msg: Grafana webhook must be http://IPv4:port/... with a real HMAC secret.

- name: Validate observability HTTP probe targets
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9._-]+$')
      - item.address | length > 0
    fail_msg: HTTP probe targets need a safe name and URL.
  loop: "{{ observability_http_targets | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Validate observability TCP probe targets
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9._-]+$')
      - item.address is match('^[0-9.A-Za-z_-]+:[0-9]+$')
    fail_msg: TCP probe targets need a safe name and host:port.
  loop: "{{ observability_tcp_targets | default([]) }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Require read-only Proxmox exporter credentials
  when: observability_pve_enabled | bool
  ansible.builtin.assert:
    that:
      - observability_pve_target | length > 0
      - observability_pve_user | length > 0
      - observability_pve_token_name | length > 0
      - observability_pve_token_value | length > 0
      - observability_pve_token_value is not match('(?i)^replace')
    fail_msg: >-
      PVE monitoring needs a target and a dedicated read-only token that is
      not the Sentinel or OpenTofu credential.
  no_log: true

- name: Create observability directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ observability_install_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/grafana"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/grafana/provisioning"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/grafana/provisioning/datasources"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/grafana/provisioning/dashboards"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/grafana/provisioning/alerting"
      owner: root
      group: "472"
      mode: "0750"
    - path: "{{ observability_install_dir }}/grafana/dashboards"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/data"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/data/prometheus"
      owner: "65534"
      group: "65534"
      mode: "0750"
    - path: "{{ observability_install_dir }}/data/grafana"
      owner: "472"
      group: "472"
      mode: "0750"
    - path: "{{ observability_install_dir }}/data/loki"
      owner: "{{ observability_loki_user }}"
      group: "{{ observability_loki_group }}"
      mode: "0750"
    - path: "{{ observability_install_dir }}/rules"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_textfile_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: /usr/local/lib/homelab
      owner: root
      group: root
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

- name: Install observability Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ observability_install_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ observability_install_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Observe Alertmanager configuration
  when: observability_alerting_enabled | bool
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: "{{ observability_install_dir }}/alertmanager.yml"
    owner: root
    group: "65534"
    mode: "0640"
  no_log: true
  notify: Recreate observability compose

- name: Remove Observe Alertmanager configuration when unused
  when: not (observability_alerting_enabled | bool)
  ansible.builtin.file:
    path: "{{ observability_install_dir }}/alertmanager.yml"
    state: absent

- name: Remove leftover Grafana AM password file
  ansible.builtin.file:
    path: "{{ observability_install_dir }}/grafana-am.password"
    state: absent

- name: Install Prometheus alert rules
  ansible.builtin.template:
    src: rules.yml.j2
    dest: "{{ observability_install_dir }}/rules/observability.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ observability_install_dir }}/loki.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Blackbox configuration
  when: observability_blackbox_enabled | bool
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ observability_install_dir }}/blackbox.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Remove Blackbox configuration when unused
  when: not (observability_blackbox_enabled | bool)
  ansible.builtin.file:
    path: "{{ observability_install_dir }}/blackbox.yml"
    state: absent

- name: Install Grafana Alerting contact points
  when: observability_alerting_enabled | bool
  ansible.builtin.template:
    src: grafana-alerting.yml.j2
    dest: "{{ observability_install_dir }}/grafana/provisioning/alerting/contact-points.yml"
    owner: root
    group: "472"
    mode: "0640"
  no_log: true
  notify: Recreate observability compose

- name: Remove Grafana Alerting contact points when unused
  when: not (observability_alerting_enabled | bool)
  ansible.builtin.file:
    path: "{{ observability_install_dir }}/grafana/provisioning/alerting/contact-points.yml"
    state: absent

- name: Install Grafana error log alert rules
  when: observability_error_log_alert_enabled | bool
  ansible.builtin.template:
    src: grafana-error-alerts.yml.j2
    dest: "{{ observability_install_dir }}/grafana/provisioning/alerting/error-logs.yml"
    owner: root
    group: "472"
    mode: "0640"
  notify: Recreate observability compose

- name: Remove Grafana error log alert rules when disabled
  when: not (observability_error_log_alert_enabled | bool)
  ansible.builtin.file:
    path: "{{ observability_install_dir }}/grafana/provisioning/alerting/error-logs.yml"
    state: absent

- name: Remove the Prometheus-only Grafana datasource filename
  ansible.builtin.file:
    path: "{{ observability_install_dir }}/grafana/provisioning/datasources/prometheus.yml"
    state: absent

- name: Install Grafana datasource provisioning
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ observability_install_dir }}/grafana/provisioning/datasources/datasources.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Grafana dashboard provisioning
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: "{{ observability_install_dir }}/grafana/provisioning/dashboards/homelab.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ observability_install_dir }}/grafana/dashboards/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dashboards/overview.json
    - dashboards/operations.json
    - dashboards/linux.json
    - dashboards/zfs.json
    - dashboards/smart.json
  notify: Recreate observability compose
  loop_control:
    label: "{{ item | basename }}"

- name: Remove retired Grafana dashboards
  ansible.builtin.file:
    path: "{{ observability_install_dir }}/grafana/dashboards/logs.json"
    state: absent
  notify: Recreate observability compose

- name: Install Docker inventory helper
  ansible.builtin.copy:
    src: docker_inventory.py
    dest: "{{ observability_docker_inventory_script }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart observe Docker inventory

- name: Install Docker inventory refresh command
  ansible.builtin.template:
    src: docker-inventory-refresh.j2
    dest: /usr/local/bin/observability-docker-inventory
    owner: root
    group: root
    mode: "0755"
  notify: Restart observe Docker inventory

- name: Install Docker inventory units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - docker-inventory.service
    - docker-inventory.timer
  notify: Restart observe Docker inventory

- name: Enable Docker inventory timer
  ansible.builtin.systemd_service:
    name: docker-inventory.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Write Docker inventory metrics once
  ansible.builtin.command:
    cmd: /usr/local/bin/observability-docker-inventory
  changed_when: false

- name: Install observability secret environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ observability_install_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Recreate observability compose

- name: Validate the observability Compose model
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ observability_install_dir }}"
  changed_when: false

- name: Apply observability handlers
  ansible.builtin.meta: flush_handlers

- name: Check whether the observability Compose project is running
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - ps
      - -q
    chdir: "{{ observability_install_dir }}"
  register: observability_compose_ps
  changed_when: false

- name: Start the observability Compose project
  when: observability_compose_ps.stdout | trim | length == 0
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - -d
      - --remove-orphans
    chdir: "{{ observability_install_dir }}"
  changed_when: true

- name: Wait for observability endpoints
  ansible.builtin.uri:
    url: "{{ item }}"
    status_code: 200
    return_content: false
  loop:
    - "http://{{ observability_prometheus_listen_address }}/-/ready"
    - "http://{{ observability_grafana_scrape_address }}/api/health"
    - "http://{{ observability_node_exporter_listen_address }}/metrics"
  register: observability_endpoint
  retries: 12
  delay: 5
  until: observability_endpoint.status | default(0) == 200

- name: Wait for Loki
  ansible.builtin.uri:
    url: "http://{{ observability_loki_ready_address }}/ready"
    status_code: 200
    return_content: false
  register: observability_loki_ready
  retries: 24
  delay: 5
  until: observability_loki_ready.status | default(0) == 200

- name: Verify the PVE exporter endpoint
  when: observability_pve_enabled | bool
  ansible.builtin.uri:
    url: "http://{{ observability_pve_exporter_listen_address }}/"
    status_code: 200
    return_content: false
  register: observability_pve_endpoint
  retries: 12
  delay: 5
  until: observability_pve_endpoint.status | default(0) == 200
