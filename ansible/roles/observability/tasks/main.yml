---
- name: Validate the target operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["os_family"] == "Debian"
    fail_msg: This role supports Debian-family Linux hosts only.

- name: Require observability inputs
  ansible.builtin.assert:
    that:
      - observability_install_dir is match('^/')
      - observability_site_label | length > 0
      - observability_retention_time | length > 0
      - observability_retention_size | length > 0
      - observability_prometheus_image | length > 0
      - observability_grafana_image | length > 0
      - observability_loki_image | length > 0
      - observability_loki_retention_period | length > 0
      - observability_loki_http_listen_address | length > 0
      - observability_loki_http_listen_port | int > 0
      - observability_loki_ready_address | length > 0
      - observability_grafana_root_url is match('^https://')
      - observability_grafana_admin_user | length > 0
      - observability_grafana_admin_password | length >= 16
      - observability_grafana_admin_password is not match('(?i)^replace')
      - observability_grafana_http_port | int > 0
      - observability_grafana_bind_ip | length > 0
    fail_msg: >-
      Observability needs a pinned stack, HTTPS Grafana root URL, Loki
      retention, and a real admin password of at least 16 characters.
  no_log: true

- name: Derive the Grafana public hostname
  ansible.builtin.set_fact:
    observability_grafana_domain: "{{ observability_grafana_root_url | urlsplit('hostname') }}"

- name: Validate observability metrics targets
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9._-]+$')
      - item.address | length > 0
      - item.metrics_path | default('/metrics') is match('^/')
    fail_msg: Metrics targets need a safe name, address, and metrics path.
  loop: "{{ observability_metrics_targets }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Validate observability node targets
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9._-]+$')
      - item.address | length > 0
    fail_msg: Node targets need a safe name and scrape address.
  loop: "{{ observability_node_targets }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Validate observability Alloy targets
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9._-]+$')
      - item.address | length > 0
      - item.dependency | default('none') | length > 0
    fail_msg: Alloy targets need a safe name, scrape address, and dependency.
  loop: "{{ observability_alloy_targets }}"
  loop_control:
    label: "{{ item.name | default('unknown') }}"

- name: Require unique expected log hosts
  when: observability_expected_log_hosts | length > 0
  ansible.builtin.assert:
    that:
      - >-
          observability_expected_log_hosts | unique | list | length
          == observability_expected_log_hosts | length
    fail_msg: expected_log_hosts must not contain duplicates.

- name: Validate expected log hosts match Alloy scrape host labels
  when: observability_expected_log_hosts | length > 0
  ansible.builtin.assert:
    that:
      - item is match('^[A-Za-z0-9._-]+$')
      - (matching_named_hosts | length) + (matching_unnamed_hosts | length) == 1
    fail_msg: >-
      Every expected log host must match exactly one Alloy scrape host label
      (target.host, or target.name when host is omitted).
  loop: "{{ observability_expected_log_hosts }}"
  vars:
    matching_named_hosts: "{{ observability_alloy_targets | selectattr('host', 'defined') | selectattr('host', 'equalto', item) | list }}"
    matching_unnamed_hosts: "{{ observability_alloy_targets | rejectattr('host', 'defined') | selectattr('name', 'equalto', item) | list }}"

- name: Validate the Alertmanager address
  when: observability_alertmanager_address | length > 0
  ansible.builtin.assert:
    that:
      - observability_alertmanager_address is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}:[0-9]+$')
    fail_msg: Observe Alertmanager address must be host:port on the Sentinel.

- name: Require read-only Proxmox exporter credentials
  when: observability_pve_enabled | bool
  ansible.builtin.assert:
    that:
      - observability_pve_target | length > 0
      - observability_pve_user | length > 0
      - observability_pve_token_name | length > 0
      - observability_pve_token_value | length > 0
      - observability_pve_token_value is not match('(?i)^replace')
    fail_msg: >-
      PVE monitoring needs a target and a dedicated read-only token that is
      not the Sentinel or OpenTofu credential.
  no_log: true

- name: Create observability directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ observability_install_dir }}"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/grafana"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/grafana/provisioning"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/grafana/provisioning/datasources"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/grafana/provisioning/dashboards"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/grafana/dashboards"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/data"
      owner: root
      group: root
      mode: "0755"
    - path: "{{ observability_install_dir }}/data/prometheus"
      owner: "65534"
      group: "65534"
      mode: "0750"
    - path: "{{ observability_install_dir }}/data/grafana"
      owner: "472"
      group: "472"
      mode: "0750"
    - path: "{{ observability_install_dir }}/data/loki"
      owner: "{{ observability_loki_user }}"
      group: "{{ observability_loki_group }}"
      mode: "0750"
    - path: "{{ observability_install_dir }}/rules"
      owner: root
      group: root
      mode: "0755"
  loop_control:
    label: "{{ item.path }}"

- name: Install observability Compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ observability_install_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ observability_install_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Prometheus alert rules
  ansible.builtin.template:
    src: rules.yml.j2
    dest: "{{ observability_install_dir }}/rules/observability.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Loki configuration
  ansible.builtin.template:
    src: loki.yml.j2
    dest: "{{ observability_install_dir }}/loki.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Remove the Prometheus-only Grafana datasource filename
  ansible.builtin.file:
    path: "{{ observability_install_dir }}/grafana/provisioning/datasources/prometheus.yml"
    state: absent

- name: Install Grafana datasource provisioning
  ansible.builtin.template:
    src: grafana-datasources.yml.j2
    dest: "{{ observability_install_dir }}/grafana/provisioning/datasources/datasources.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Grafana dashboard provisioning
  ansible.builtin.template:
    src: grafana-dashboards.yml.j2
    dest: "{{ observability_install_dir }}/grafana/provisioning/dashboards/homelab.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Recreate observability compose

- name: Install Grafana dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ observability_install_dir }}/grafana/dashboards/{{ item | basename }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - dashboards/overview.json
    - dashboards/linux.json
    - dashboards/zfs.json
    - dashboards/smart.json
  notify: Recreate observability compose
  loop_control:
    label: "{{ item | basename }}"

- name: Install observability secret environment
  ansible.builtin.template:
    src: env.j2
    dest: "{{ observability_install_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Recreate observability compose

- name: Validate the observability Compose model
  ansible.builtin.command:
    cmd: docker compose config --quiet
    chdir: "{{ observability_install_dir }}"
  changed_when: false

- name: Apply observability handlers
  ansible.builtin.meta: flush_handlers

- name: Check whether the observability Compose project is running
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - ps
      - -q
    chdir: "{{ observability_install_dir }}"
  register: observability_compose_ps
  changed_when: false

- name: Start the observability Compose project
  when: observability_compose_ps.stdout | trim | length == 0
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - up
      - -d
      - --remove-orphans
    chdir: "{{ observability_install_dir }}"
  changed_when: true

- name: Wait for observability endpoints
  ansible.builtin.uri:
    url: "{{ item }}"
    status_code: 200
    return_content: false
  loop:
    - "http://{{ observability_prometheus_listen_address }}/-/ready"
    - "http://{{ observability_grafana_scrape_address }}/api/health"
    - "http://{{ observability_node_exporter_listen_address }}/metrics"
  register: observability_endpoint
  retries: 12
  delay: 5
  until: observability_endpoint.status | default(0) == 200

- name: Wait for Loki
  ansible.builtin.uri:
    url: "http://{{ observability_loki_ready_address }}/ready"
    status_code: 200
    return_content: false
  register: observability_loki_ready
  retries: 24
  delay: 5
  until: observability_loki_ready.status | default(0) == 200

- name: Verify the PVE exporter endpoint
  when: observability_pve_enabled | bool
  ansible.builtin.uri:
    url: "http://{{ observability_pve_exporter_listen_address }}/"
    status_code: 200
    return_content: false
  register: observability_pve_endpoint
  retries: 12
  delay: 5
  until: observability_pve_endpoint.status | default(0) == 200
