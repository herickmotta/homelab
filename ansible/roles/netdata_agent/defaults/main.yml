---
netdata_agent_state: present
netdata_agent_kickstart_url: https://get.netdata.cloud/kickstart.sh
netdata_agent_release_channel: stable
netdata_agent_config_dir: /etc/netdata
netdata_agent_bind_to: "*"
netdata_agent_allow_from: localhost
netdata_agent_enable_zfspool: false
netdata_agent_enable_smartctl: false
netdata_agent_enable_samba: false
netdata_agent_zpool_binary: /usr/sbin/zpool
netdata_agent_required_services: []
netdata_agent_required_mount_paths: []
netdata_agent_disk_mount_points: []
netdata_agent_disk_free_warn_percent: 15
netdata_agent_disk_free_crit_percent: 5
netdata_agent_email_destination: ""
netdata_agent_smtp_host: ""
netdata_agent_smtp_port: 587
netdata_agent_smtp_username: ""
netdata_agent_smtp_password: ""
netdata_agent_smtp_from: ""
netdata_agent_smtp_starttls: true
netdata_agent_mail_packages:
  - msmtp-mta
  - bsd-mailx
netdata_agent_packages:
  - ca-certificates
  - curl
netdata_agent_absent_paths:
  - /etc/netdata
  - /opt/netdata
  - /var/log/netdata
  - /var/cache/netdata
  - /var/lib/netdata
  - /usr/libexec/netdata-uninstaller.sh
