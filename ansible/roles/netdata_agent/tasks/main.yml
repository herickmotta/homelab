---
- name: Validate the target operating system
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["os_family"] == "Debian"
      - netdata_agent_state in ["present", "absent"]
    fail_msg: netdata_agent_state must be present or absent on Debian-family Linux.

- name: Configure the Netdata agent
  when: netdata_agent_state == "present"
  ansible.builtin.include_tasks: present.yml

- name: Remove the Netdata agent
  when: netdata_agent_state == "absent"
  ansible.builtin.include_tasks: absent.yml
