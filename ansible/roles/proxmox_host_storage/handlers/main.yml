---
- name: Restart smartd
  ansible.builtin.systemd_service:
    name: smartd.service
    state: restarted
    daemon_reload: true

- name: Restart ZED
  ansible.builtin.systemd_service:
    name: zfs-zed.service
    state: restarted
    daemon_reload: true

- name: Restart node exporter
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter.service
    state: restarted
    daemon_reload: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
