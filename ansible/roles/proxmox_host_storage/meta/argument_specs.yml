---
argument_specs:
  main:
    short_description: Assert host-owned ZFS and configure smartd, ZED, and OpenZFS scrubs
    options:
      proxmox_host_storage_pools:
        type: dict
        required: true
      proxmox_host_storage_datasets:
        type: dict
        required: true
      proxmox_host_storage_data_uid:
        type: int
        default: 10000
      proxmox_host_storage_data_gid:
        type: int
        default: 10000
      proxmox_host_storage_email_destination:
        type: str
      proxmox_host_storage_smtp_host:
        type: str
      proxmox_host_storage_smtp_port:
        type: int
        default: 587
      proxmox_host_storage_smtp_username:
        type: str
      proxmox_host_storage_smtp_password:
        type: str
      proxmox_host_storage_smtp_from:
        type: str
      proxmox_host_storage_smtp_starttls:
        type: bool
        default: true
      proxmox_host_storage_smartd_short_test:
        type: str
        default: "S/../../1/02"
      proxmox_host_storage_smartd_long_test:
        type: str
        default: "L/../07/./03"
      proxmox_host_storage_packages:
        type: list
        elements: str
      proxmox_host_storage_mail_packages:
        type: list
        elements: str
      proxmox_host_storage_retired_units:
        type: list
        elements: str
      proxmox_host_storage_retired_files:
        type: list
        elements: str
