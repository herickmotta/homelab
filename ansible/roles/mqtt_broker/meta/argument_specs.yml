---
argument_specs:
  main:
    short_description: Deploy a localhost-only Mosquitto Compose project
    options:
      mqtt_broker_install_dir:
        type: str
      mqtt_broker_owner:
        type: str
      mqtt_broker_group:
        type: str
      mqtt_broker_image:
        type: str
      mqtt_broker_container_name:
        type: str
      mqtt_broker_network:
        type: str
      mqtt_broker_port:
        type: int
      mqtt_broker_user:
        type: str
        required: true
      mqtt_broker_password:
        type: str
        required: true
      mqtt_broker_uid:
        type: int
      mqtt_broker_gid:
        type: int
