name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  opentofu:
    name: opentofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.1

      - name: Format
        run: tofu fmt -check -recursive

      - name: Validate
        run: |
          set -euo pipefail
          roots=()
          if ls -- *.tf >/dev/null 2>&1; then
            roots+=(".")
          fi
          for d in examples/*/ modules/*/; do
            if [ -d "${d}" ] && ls -- "${d}"*.tf >/dev/null 2>&1; then
              roots+=("${d}")
            fi
          done
          if [ "${#roots[@]}" -eq 0 ]; then
            echo "No OpenTofu roots to validate"
            exit 0
          fi
          for root in "${roots[@]}"; do
            echo "Validating ${root}"
            (cd "${root}" && tofu init -backend=false -input=false && tofu validate)
          done

  ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible-lint

      - name: Lint
        run: ansible-lint ansible

      - name: Build collection
        run: ansible-galaxy collection build ansible --output-path /tmp

      - name: Test per-host log freshness
        run: |
          pip install jinja2 pyyaml
          python3 tests/observability/test_log_freshness.py

      - name: Test ops coverage alerts
        run: python3 tests/observability/test_ops_alerts.py

      - name: Test Hermes Agent rendered contract
        run:           python3 tests/hermes_agent/test_rendered_contract.py

      - name: Test Hermes pve-get file credentials
        run: python3 tests/hermes_agent/test_pve_get.py

      - name: Test Grafana Hermes HMAC relay
        run: python3 tests/hermes_agent/test_grafana_relay.py

      - name: Test Grafana alert datasources
        run:           python3 tests/observability/test_grafana_datasources.py

      - name: Test Grafana contact points and Observe blackbox
        run: python3 tests/observability/test_grafana_alerting.py

      - name: Test Alertmanager Telegram paging
        run: python3 tests/sentinel_monitoring/test_alertmanager_telegram.py

      - name: Test Grafana error log alert
        run: python3 tests/observability/test_error_log_alert.py

      - name: Test Docker inventory metrics
        run: python3 tests/host_metrics/test_docker_inventory.py

      - name: Test local TCP probe is connect-only
        run: python3 tests/host_metrics/test_local_tcp_probe.py

      - name: Test Docker inventory dashboard
        run: python3 tests/observability/test_docker_inventory_dashboard.py

      - name: Test Loki Logs Drilldown service names
        run: python3 tests/observability/test_logs_drilldown.py

  ci:
    name: ci
    if: always()
    needs: [opentofu, ansible]
    runs-on: ubuntu-latest
    steps:
      - name: Merge job results
        run: |
          set -euo pipefail
          tofu_result="${{ needs.opentofu.result }}"
          ansible_result="${{ needs.ansible.result }}"
          echo "opentofu=${tofu_result} ansible=${ansible_result}"
          if [ "${tofu_result}" = failure ] || [ "${tofu_result}" = cancelled ]; then
            exit 1
          fi
          if [ "${ansible_result}" = failure ] || [ "${ansible_result}" = cancelled ]; then
            exit 1
          fi
