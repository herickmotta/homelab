---
- name: Build the fictional Hermes Agent inventory
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../site.example.yaml
  tasks:
    - name: Add the fictional Hermes guest
      ansible.builtin.add_host:
        name: "{{ site.guests.hermes.hostname }}"
        ansible_host: "{{ site.guests.hermes.ipv4 }}"
        ansible_user: "{{ site.access.username }}"
        groups:
          - hermes_agent

- name: Configure the fictional Hermes Agent
  hosts: hermes_agent
  become: true
  gather_facts: true
  vars_files:
    - ../site.example.yaml
  roles:
    - role: herickmotta.homelab.guest_base
    - role: herickmotta.homelab.hermes_agent
      vars:
        hermes_agent_enabled: "{{ site.hermes.enabled | bool }}"
        hermes_agent_full_capability: "{{ site.hermes.full_capability | bool }}"
        hermes_agent_timezone: "{{ site.timezone }}"
        hermes_agent_provider: "{{ site.hermes.provider }}"
        hermes_agent_model: "{{ site.hermes.model }}"
        hermes_agent_telegram_enabled: true
        hermes_agent_telegram_user_id: "{{ site.hermes.telegram_user_id }}"
        hermes_agent_telegram_admin_id: "{{ site.hermes.telegram_user_id }}"
        hermes_agent_telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
        hermes_agent_provider_api_key: "{{ lookup('env', 'HERMES_PROVIDER_API_KEY') | default('', true) }}"
        hermes_agent_github_enabled: "{{ site.hermes.github.enabled | default(false) | bool }}"
        hermes_agent_github_app_id: "{{ site.hermes.github.app_id | default('') }}"
        hermes_agent_github_installation_id: "{{ site.hermes.github.installation_id | default('') }}"
        hermes_agent_github_app_slug: "{{ site.hermes.github.app_slug | default('') }}"
        hermes_agent_github_git_name: "{{ site.hermes.github.git_name | default('') }}"
        hermes_agent_github_git_email: "{{ site.hermes.github.git_email | default('') }}"
        hermes_agent_github_repos: "{{ site.hermes.github.repos | default([]) }}"
        hermes_agent_github_app_private_key: "{{
            lookup('env', 'HERMES_GITHUB_APP_PRIVATE_KEY') | default('', true)
            if (site.hermes.github.enabled | default(false) | bool)
            else ''
          }}"
        hermes_agent_pve_enabled: "{{ site.hermes.pve.enabled | default(false) | bool }}"
        hermes_agent_pve_ipv4: "{{ site.hypervisor.endpoint_ipv4 }}"
        hermes_agent_pve_user: "{{ site.hermes.pve.user | default('') }}"
        hermes_agent_pve_token_name: "{{ site.hermes.pve.token_name | default('') }}"
        hermes_agent_pve_verify_ssl: "{{ site.hermes.pve.verify_ssl | default(false) | bool }}"
        hermes_agent_pve_token_value: "{{
            lookup('env', 'PVE_HERMES_TOKEN_VALUE') | default('', true)
            if (site.hermes.pve.enabled | default(false) | bool)
            else ''
          }}"
        hermes_agent_grafana_enabled: "{{ site.hermes.grafana.enabled | default(false) | bool }}"
        hermes_agent_grafana_ipv4: "{{ site.hermes.grafana.ipv4 | default('') }}"
        hermes_agent_grafana_port: "{{ site.hermes.grafana.port | default(3000) | int }}"
        hermes_agent_grafana_url: "{{ site.hermes.grafana.url | default('') }}"
        hermes_agent_grafana_viewer_token: "{{
            lookup('env', 'GRAFANA_HERMES_VIEWER_TOKEN') | default('', true)
            if (site.hermes.grafana.enabled | default(false) | bool)
            else ''
          }}"
        hermes_agent_grafana_mcp_server_token: "{{
            lookup('env', 'GRAFANA_HERMES_MCP_SERVER_TOKEN') | default('', true)
            if (site.hermes.grafana.enabled | default(false) | bool)
            else ''
          }}"
        hermes_agent_webhook_enabled: "{{ site.hermes.webhook.enabled | default(false) | bool }}"
        hermes_agent_alert_ipv4: "{{ site.guests.hermes.ipv4 }}"
        hermes_agent_alert_allow_ipv4: "{{ site.hosts.watchdog.ipv4 }}"
        hermes_agent_alert_bearer_token: "{{
            lookup('env', 'HERMES_ALERT_BEARER') | default('', true)
            if (site.hermes.webhook.enabled | default(false) | bool)
            else ''
          }}"
        hermes_agent_webhook_hmac_secret: "{{
            lookup('env', 'HERMES_WEBHOOK_HMAC') | default('', true)
            if (site.hermes.webhook.enabled | default(false) | bool)
            else ''
          }}"
