# Fictional reference values only. 192.0.2.0/24 and example.test are reserved
# for documentation and must not be applied to a real network.
---
site:
  domain: lab.example.test
  timezone: Etc/UTC

  hypervisor:
    endpoint_ipv4: 192.0.2.10
    node_name: pve-example
    bridge: vmbr0
    datastore: local-lvm
    pci_mappings:
      example-igpu:
        id: "8086:0000"
        path: "0000:00:02.0"
        comment: Fictional Intel iGPU mapping

  # Brownfield machines. OpenTofu does not create these; keep them out of guests.
  hosts:
    watchdog:
      hostname: sentinel-example
      ipv4: 192.0.2.11
      role: sentinel
      bootstrap_user: operator
      ansible_user: gha
      ubuntu_release: "24.04"
      management_cidrs:
        - 192.0.2.0/24
      runner:
        repository_url: https://github.com/example/homelab-live
        name: sentinel-example
        labels:
          - sentinel

  network:
    cidr: 192.0.2.0/24
    prefix_length: 24
    gateway: 192.0.2.1
    dns:
      - 192.0.2.12

  access:
    username: ubuntu
    ssh_public_keys:
      - >-
        ssh-ed25519
        AAAAC3NzaC1lZDI1NTE5AAAAIExampleKeyOnlyNotRealAAAAAAAAAAAA
        example@invalid

  monitoring:
    sentinel:
      site_label: example
      retention_time: 72h
      retention_size: 10GB
      alertmanager_bind_address: "0.0.0.0:9093"
      pve_exporter:
        enabled: true
        user: prometheus@pve
        token_name: sentinel
        verify_ssl: false
      critical_guest_ids:
        - 112
        - 114
        - 115
        - 116
        - 117
      icmp_targets:
        - name: gateway
          address: 192.0.2.1
          kind: network
          dependency: none
        - name: pve-example
          address: 192.0.2.10
          kind: hypervisor
          dependency: none
        - name: hermes
          address: 192.0.2.17
          kind: service
          dependency: pve
      http_targets:
        - name: adguard
          address: https://adguard.lab.example.test
          kind: service
          dependency: pve
        - name: frigate
          address: https://frigate.lab.example.test
          kind: service
          dependency: pve
        - name: homeassistant
          address: https://ha.lab.example.test
          kind: service
          dependency: pve
        - name: grafana
          address: https://grafana.lab.example.test
          kind: service
          dependency: pve
      tcp_targets:
        - name: proxmox-api
          address: 192.0.2.10:8006
          kind: pve_api
          dependency: pve
      metrics_targets:
        - name: frigate
          address: 192.0.2.15:8971
          scheme: http
          metrics_path: /api/metrics
          keep_metrics:
            - frigate_camera_fps
            - frigate_process_fps
          dependency: pve
    observability:
      site_label: example
      retention_time: 15d
      retention_size: 40GB
      grafana_root_url: https://grafana.lab.example.test
      loki_retention_period: 336h
      prometheus_listen_address: "192.0.2.16:9090"
      alertmanager_address: "192.0.2.11:9093"
      pve_exporter:
        enabled: true
        user: observe@pve
        token_name: observe
        verify_ssl: false
      metrics_targets:
        - name: frigate
          address: 192.0.2.15:8971
          scheme: http
          metrics_path: /api/metrics
          dependency: pve
      alloy_targets:
        - name: net
          address: 192.0.2.12:12345
          host: net-example
          dependency: pve
        - name: nas
          address: 192.0.2.14:12345
          host: nas-example
          dependency: pve
        - name: apps
          address: 192.0.2.15:12345
          host: apps-example
          dependency: pve
        - name: observe
          address: 192.0.2.16:12345
          host: observe-example
          dependency: pve
        - name: hermes
          address: 192.0.2.17:12345
          host: hermes-example
          dependency: pve
        - name: pve
          address: 192.0.2.10:12345
          host: pve-example
          dependency: pve
        - name: sentinel
          address: 192.0.2.11:12345
          host: sentinel-example
          dependency: none
      expected_log_hosts:
        - net-example
        - nas-example
        - apps-example
        - observe-example
        - hermes-example
        - pve-example
        - sentinel-example
    host_metrics:
      node_targets:
        - name: net
          address: 192.0.2.12:9100
          host: net-example
        - name: nas
          address: 192.0.2.14:9100
          host: nas-example
        - name: apps
          address: 192.0.2.15:9100
          host: apps-example
        - name: hermes
          address: 192.0.2.17:9100
          host: hermes-example
        - name: pve
          address: 192.0.2.10:9100
          host: pve-example
        - name: sentinel
          address: 192.0.2.11:9100
          host: sentinel
      smartctl_address: 192.0.2.10:9633
      zfs_address: 192.0.2.10:9134
      hosts:
        net-example:
          systemd_units:
            - tailscaled.service
            - alloy.service
        nas-example:
          systemd_units:
            - smbd.service
            - alloy.service
        apps-example:
          systemd_units:
            - alloy.service
          local_tcp_probes:
            - name: mosquitto
              address: "127.0.0.1:1883"
          container_probes:
            - name: mosquitto
              label: homelab.role=mqtt_broker
            - name: frigate
              label: homelab.role=frigate
            - name: homeassistant
              label: homelab.role=homeassistant
        hermes-example:
          systemd_units:
            - alloy.service
          container_probes:
            - name: hermes-agent
              label: homelab.role=hermes_agent
        pve-example:
          systemd_units:
            - smartmontools.service
            - zfs-zed.service
            - alloy.service
        sentinel-example:
          systemd_units:
            - sentinel-monitoring.service
            - alloy.service
    log_shipper:
      loki_write_url: http://192.0.2.16:3100/loki/api/v1/push
      hosts:
        net-example:
          docker: true
          journal_units:
            - tailscaled.service
        nas-example:
          docker: false
          journal_units:
            - smbd.service
        apps-example:
          docker: true
          journal_units: []
        observe-example:
          docker: true
          journal_units: []
        hermes-example:
          docker: true
          journal_units: []
        pve-example:
          docker: false
          journal_units:
            - pvedaemon.service
            - pveproxy.service
            - pvestatd.service
            - zfs-zed.service
            - smartmontools.service
        sentinel-example:
          docker: true
          journal_units:
            - sentinel-monitoring.service

  guests:
    network_plane:
      hostname: net-example
      vm_id: 112
      ipv4: 192.0.2.12
      dns_servers:
        - 192.0.2.1
      groups:
        - homelab_guest
        - network_plane
        - host_metrics
        - log_shipper
      cores: 2
      memory_mb: 4096
      disk_gb: 16
      tags:
        - network
      startup:
        order: 1
        up_delay: 15
      proxy_routes:
        - hostname: adguard
          upstream: 127.0.0.1:3000
        - hostname: frigate
          upstream: 192.0.2.15:8971
        - hostname: ha
          upstream: 192.0.2.15:8123
        - hostname: grafana
          upstream: 192.0.2.16:3000

    application_runtime:
      hostname: apps-example
      vm_id: 115
      ipv4: 192.0.2.15
      groups:
        - homelab_guest
        - application_runtime
        - frigate
        - mqtt_broker
        - homeassistant
        - host_metrics
        - log_shipper
      cores: 4
      cpu_type: host
      memory_mb: 8192
      disk_gb: 64
      machine: q35
      tags:
        - apps
      startup:
        order: 3
      virtiofs:
        - mapping: example-frigate
      hostpci:
        - mapping: example-igpu
          pcie: true
      virtiofs_mounts:
        - mapping: example-frigate
          path: /mnt/frigate

    nas_gateway:
      hostname: nas-example
      vm_id: 114
      ipv4: 192.0.2.14
      groups:
        - homelab_guest
        - nas_server
        - host_metrics
        - log_shipper
      cores: 2
      memory_mb: 4096
      disk_gb: 32
      tags:
        - nas
      startup:
        order: 2
      virtiofs:
        - mapping: example-personal
          expose_acl: true
        - mapping: example-media
          expose_acl: true

    observability:
      hostname: observe-example
      vm_id: 116
      ipv4: 192.0.2.16
      groups:
        - homelab_guest
        - observability
        - log_shipper
      cores: 4
      memory_mb: 8192
      disk_gb: 128
      tags:
        - observe
      startup:
        order: 4

    hermes:
      hostname: hermes-example
      vm_id: 117
      ipv4: 192.0.2.17
      groups:
        - homelab_guest
        - hermes_agent
        - host_metrics
        - log_shipper
      cores: 2
      memory_mb: 4096
      disk_gb: 32
      tags:
        - hermes
      startup:
        order: 5

  storage:
    pools:
      iron:
        name: iron
        topology: raidz1
        data_class: durable
        ashift: 12
        compression: lz4
        atime: "off"
        disks:
          - serial: FAKEIRON01
            by_id: /dev/disk/by-id/ata-EXAMPLE-FAKEIRON01
          - serial: FAKEIRON02
            by_id: /dev/disk/by-id/ata-EXAMPLE-FAKEIRON02
          - serial: FAKEIRON03
            by_id: /dev/disk/by-id/ata-EXAMPLE-FAKEIRON03
      volatile:
        name: volatile
        topology: stripe
        data_class: disposable
        ashift: 12
        compression: lz4
        atime: "off"
        disks:
          - serial: FAKEVOL01
            by_id: /dev/disk/by-id/ata-EXAMPLE-FAKEVOL01
            accepted_degraded: true
    datasets:
      personal:
        pool: iron
        dataset: iron/personal
        mountpoint: /srv/example/iron/personal
        mapping_id: example-personal
        class: important_unbacked
      media:
        pool: iron
        dataset: iron/media
        mountpoint: /srv/example/iron/media
        mapping_id: example-media
        class: replaceable
      frigate:
        pool: volatile
        dataset: volatile/frigate
        mountpoint: /srv/example/volatile/frigate
        mapping_id: example-frigate
        class: disposable
      cache:
        pool: volatile
        dataset: volatile/cache
        mountpoint: /srv/example/volatile/cache
        class: disposable
      tmp:
        pool: volatile
        dataset: volatile/tmp
        mountpoint: /srv/example/volatile/tmp
        class: disposable
    monitoring:
      email_destination: storage@example.test
      smtp:
        host: smtp.example.test
        port: 587
        username: alerts@example.test
        from: homelab@example.test
        starttls: true
      smartd:
        short_test: "S/../../1/02"
        long_test: "L/../07/./03"
      netdata:
        allow_from: "localhost 192.0.2.0/24"
    nas:
      smb_username: household
      smb_uid: 10000
      smb_gid: 10000
      mounts:
        - mapping: example-personal
          path: /srv/personal
          share: personal
          read_only: false
        - mapping: example-media
          path: /srv/media
          share: media
          read_only: false

  mqtt:
    user: homelab
    network: mqtt

  homeassistant:
    name: Home
    external_url: https://ha.lab.example.test
    trusted_proxies:
      - 192.0.2.12
      - 127.0.0.1

  # Official Hermes Agent on a dedicated guest. The Telegram bot token stays
  # in the site secret store. openai-codex authenticates with ChatGPT device
  # login into the persistent data volume. The numeric Telegram user is also
  # the administrator.
  hermes:
    enabled: true
    full_capability: true
    provider: openai-codex
    model: gpt-5.6-luna
    telegram_user_id: "123456789"
    github:
      enabled: false
    pve:
      enabled: false

  frigate:
    media_path: /mnt/frigate
    gpu_enabled: false
    model: bundled
    mqtt_enabled: true
    mqtt_host: mosquitto
    loopback_api: true
    objects_track:
      - person
      - cat
    # Stacked dual-lens example: one RTSP pull per device, ffmpeg crops into
    # Frigate cameras. Combined streams are go2rtc-only. Fictional IPs.
    # Software crops (CPU). When gpu_enabled, use the role templates instead:
    #   ffmpeg:porch_combined#video=h264_vaapi_crop_top#input=vaapi_rtsp
    #   ffmpeg:porch_combined#video=h264_vaapi_crop_bottom#input=vaapi_rtsp
    # Optional gpu_hw_decode: true runs VAAPI HEVC decode, then CPU crop, then
    # h264_vaapi encode. Do not add #hardware on a #raw=-vf crop line; go2rtc
    # drops the crop.
    go2rtc_streams:
      porch_combined:
        - "rtsp://camera:{FRIGATE_CAM_PASS_URL}@192.0.2.80:554/user=camera&password={FRIGATE_CAM_PASS_URL}&channel=1&stream=0.sdp?"
      porch_top:
        - "ffmpeg:porch_combined#video=h264#raw=-vf crop=iw:ih/2:0:0"
      porch_bottom:
        - "ffmpeg:porch_combined#video=h264#raw=-vf crop=iw:ih/2:0:ih/2"
      yard_combined:
        - "rtsp://camera:{FRIGATE_CAM_PASS_URL}@192.0.2.81:554/user=camera&password={FRIGATE_CAM_PASS_URL}&channel=1&stream=0.sdp?"
      yard_top:
        - "ffmpeg:yard_combined#video=h264#raw=-vf crop=iw:ih/2:0:0"
      yard_bottom:
        - "ffmpeg:yard_combined#video=h264#raw=-vf crop=iw:ih/2:0:ih/2"
    cameras:
      - name: porch_top
        enabled: false
      - name: porch_bottom
        enabled: false
      - name: yard_top
        enabled: false
      - name: yard_bottom
        enabled: false
    # Crops are normalized [x1, y1, x2, y2] from the Frigate UI. Do not invent them.
    classifications:
      porch_gate:
        threshold: 0.8
        state_config:
          motion: true
          cameras:
            porch_bottom:
              crop: [0.10, 0.40, 0.35, 0.90]
